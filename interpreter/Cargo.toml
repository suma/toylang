[package]
name = "interpreter"
version = "0.1.0"
edition = "2021"
authors = ["Shuzo Kashihara <suman.orega.warukatta@gmail.com>"]
license = "MIT"
description = ""

[dependencies]
frontend = { path = "../frontend", features = ["serde"] }
serde_json = "1.0"
compiler_core = { path = "../compiler_core" }
compiler_ir = { path = "../compiler_ir" }
compiler_lower = { path = "../compiler_lower" }
toylang_rt = { path = "../compiler/runtime/toylang_rt" }
string-interner = "0.20.0"
libloading = "0.8"
rayon = "1.12"
cranelift = { version = "0.131", optional = true }
cranelift-jit = { version = "0.131", optional = true }
cranelift-module = { version = "0.131", optional = true }
cranelift-frontend = { version = "0.131", optional = true }
cranelift-codegen = { version = "0.131", optional = true }
cranelift-native = { version = "0.131", optional = true }

[features]
default = ["jit"]
jit = [
    "dep:cranelift",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-frontend",
    "dep:cranelift-codegen",
    "dep:cranelift-native",
]
debug-logging = []
test-logging = ["debug-logging"]

[dev-dependencies]
proptest = "1.11"
criterion = { version = "0.8", features = ["html_reports"] }
serial_test = "3.4"
tempfile = "3.27"

[[bench]]
name = "interpreter_bench"
harness = false

[[bench]]
name = "jit_bench"
harness = false

[lints]
workspace = true
