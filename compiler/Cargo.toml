[package]
autotests = false
name = "compiler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AOT compiler that lowers toylang to a native executable via Cranelift Object"

[[bin]]
name = "compiler"
path = "src/main.rs"

[dependencies]
frontend = { path = "../frontend", features = ["serde"] }
compiler_core = { path = "../compiler_core" }
compiler_ir = { path = "../compiler_ir" }
compiler_lower = { path = "../compiler_lower" }
interpreter = { path = "../interpreter", default-features = false }
toylang_rt = { path = "../compiler/runtime/toylang_rt" }
string-interner.workspace = true

cranelift = "0.131"
cranelift-codegen = "0.131"
cranelift-control = "0.131"
cranelift-frontend = "0.131"
cranelift-module = "0.131"
cranelift-object = "0.131"
cranelift-jit = "0.131"
cranelift-native = "0.131"
target-lexicon = "0.13"
bincode = "1.3"
rayon = "1.12"
libloading = "0.8"

[dev-dependencies]
tempfile = "3.27"
# The cross-backend suites (`consistency.rs`, `example_consistency.rs`)
# get their JIT column from `interpreter` with `RunOptions::jit = true`.
# The normal dependency above turns default features off, which drops
# the interpreter's `jit` feature and makes that flag a no-op — the
# suites would then run the tree-walker twice and call it agreement.
# Whole-workspace runs hid this because feature unification pulled `jit`
# back in via the interpreter's own tests; `cargo test -p compiler`
# alone did not. Asking for it here makes the test build honest on its
# own, and `interpreter::jit_available()` is asserted in both suites so
# a future change cannot quietly undo it.
interpreter = { path = "../interpreter", features = ["jit"] }

# Runtime is pre-compiled at compiler-build time (`build.rs` compiles
# `toylang_rt` to a staticlib with a bare rustc invocation) so each
# `compile_file(... emit=Executable)` only links rather than building
# the runtime from scratch — turns each AOT e2e test from a
# per-invocation compile into a quick link of two pre-built artefacts.
[build-dependencies]

[lints]
workspace = true

# One test target instead of one per `tests/*.rs`. See tests/suite.rs
# for why; `autotests = false` above disables the per-file default.
[[test]]
name = "suite"
path = "tests/suite.rs"
