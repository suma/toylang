# cargo nextest configuration.
#
# Cranelift's `opt_level` defaults to `"speed"` everywhere the AOT /
# JIT pipeline is invoked (see `compiler/src/codegen/mod.rs::cranelift_opt_level`).
# For the test suite we override to `"none"` because each test runs
# its own AOT compile via `assert_consistent` and we don't care about
# the produced binary's runtime quality — only that it links and
# executes correctly. Cranelift at opt_level=none is roughly **3x
# faster** at codegen, which on the workspace measured at:
#
#   speed: nextest summary 150s, real 231s
#   none:  nextest summary  54s, real  60s   (compiler crate, 205 tests)
#
# Override locally with `TOYLANG_CRANELIFT_OPT_LEVEL=speed cargo
# nextest run` if you want to verify against the production setting.

## Output volume
#
# A green full-suite run printed **1641 lines** with nextest's stock
# settings — one PASS line per test, 1634 of which say nothing. The run
# itself takes ~4s, so wall-clock was never the problem; reading the
# output was. `status-level = "fail"` cuts a green run to a handful of
# lines and leaves failures rendered in full.
#
# Use `--profile verbose` when you actually want the per-test roll call
# (bisecting a hang, checking that a filter matched what you meant).

[profile.default]
# Only report tests that failed while the run is in progress...
status-level = "fail"
# ...and only list failures in the final summary. The `Summary [...] N
# tests run: N passed` line is printed either way, so a green run still
# confirms how many tests ran.
final-status-level = "fail"

# Everything, including one line per passing test. The old default.
[profile.verbose]
status-level = "all"
final-status-level = "all"

[profile.default.env]
TOYLANG_CRANELIFT_OPT_LEVEL = "none"
