[package]
name = "toy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The toylang build and run tool (BUILD_TOOL.md)."
build = "build.rs"

[[bin]]
name = "toy"
path = "src/main.rs"

[dependencies]
compiler = { path = "../compiler" }
compiler_core = { path = "../compiler_core" }
compiler_lower = { path = "../compiler_lower" }
frontend = { path = "../frontend" }
interpreter = { path = "../interpreter" }

[dev-dependencies]
serde_json = "1.0"
